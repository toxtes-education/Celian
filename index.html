<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exercices STAPS Célian</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5c6670;--ac:#e8590c;--ok:#2b8a3e;--okb:#e6f4ea;--ko:#c92a2a;--kob:#fdeaea;--bd:#d9dde2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2328;--tx:#eceff2;--mu:#9aa5b0;--ok:#69db7c;--okb:#173324;--ko:#ff8787;--kob:#3a1c1c;--bd:#323a42}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1e2328;--tx:#eceff2;--mu:#9aa5b0;--ok:#69db7c;--okb:#173324;--ko:#ff8787;--kob:#3a1c1c;--bd:#323a42}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0 4px}p.s{color:var(--mu);margin:0 0 14px;font-size:.9rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}.tabs button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.bar{height:6px;background:var(--bd);border-radius:9px;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.n{color:var(--mu);font-size:.8rem}.q{font-weight:600;margin:4px 0 12px}
label{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer}
label input{margin-top:4px;width:18px;height:18px;flex:none}
label.ok{background:var(--okb);border-color:var(--ok)}label.ko{background:var(--kob);border-color:var(--ko)}
.tag{margin-left:auto;font-size:.75rem;font-weight:700;white-space:nowrap}
.ex{margin-top:12px;padding:12px;border-left:4px solid var(--ac);background:var(--bg);border-radius:6px;font-size:.92rem}
.cours{border-left-color:var(--ok)}.cours blockquote{margin:8px 0;padding-left:10px;border-left:2px solid var(--bd);font-style:italic;color:var(--mu)}.cours a{color:var(--ac);font-weight:600;text-decoration:none}
.ghost{background:transparent!important;color:var(--tx)!important;border:1px solid var(--bd)!important}
.btn{margin-top:12px;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.big{font-size:2rem;font-weight:700;color:var(--ac)}
</style></head><body><main>
<h1>Exercices STAPS Célian</h1>
<p class="s">Plusieurs réponses possibles : coche les propositions que tu penses vraies, puis valide. Choisis ton cours ci-dessous, et arrête-toi quand tu veux : ta progression est gardée.</p>
<div class="tabs" id="tabs"></div><div id="app"></div></main>
<script>
const C=[
{t:"Cours 1 · Thermorégulation",q:[
["L'homéostasie désigne :",[["la capacité à maintenir un milieu interne stable face aux variations extérieures",1],["l'augmentation de la température lors de l'effort",0],["un exemple de rupture : l'altitude",1],["un mécanisme qui n'existe que chez le sportif",0]],"L'homéostasie = stabilité du milieu interne. L'altitude la rompt, la thermorégulation la protège. Elle concerne tout organisme vivant, pas seulement le sportif."],
["L'être humain est un homéotherme (endotherme). Donc :",[["il maintient sa température centrale proche de 37 °C",1],["sa température dépend uniquement du milieu ambiant",0],["la température centrale est gérée par le cerveau",1],["elle ne varie jamais",0]],"Le noyau est maintenu autour de 37 °C, géré par le cerveau (hypothalamus). Elle peut pourtant varier avec le milieu et l'effort."],
["À l'exercice, on peut observer :",[["une température centrale supérieure à 40 °C",1],["une température musculaire d'environ 42 °C",1],["une température musculaire inférieure à celle du repos",0],["un stockage important de chaleur",1]],"Au repos ~37 °C, mais à l'effort le centre peut dépasser 40 °C et le muscle atteindre ~42 °C : l'organisme stocke beaucoup de chaleur."],
["Selon le principe de thermodynamique, 100 % d'énergie chimique donne :",[["25 % d'énergie mécanique",1],["75 % d'énergie thermique",1],["75 % d'énergie mécanique",0],["50 % mécanique et 50 % thermique",0]],"Seulement 1/4 devient mécanique ; 3/4 deviennent chaleur endogène, responsable de la hausse de température interne."],
["Plus l'effort est intense :",[["plus le besoin d'énergie mécanique augmente",1],["plus la production de chaleur endogène augmente",1],["moins le corps produit de chaleur",0],["plus la sudation est faible",0]],"Plus d'énergie mécanique = plus d'énergie chimique consommée, donc 75 % de chaleur en plus. Le débit sudoral augmente pour compenser."],
["Quel rôle joue l'hypothalamus ?",[["il joue le rôle de thermostat autour de 37 °C",1],["il évacue la chaleur vers le milieu ambiant via la peau",1],["il stocke la chaleur dans les muscles",0],["il ne s'active qu'au froid",0]],"L'hypothalamus régule dans les deux sens : chaleur (transfert par le sang vers la peau) et froid (frisson)."],
["Les quatre processus d'évacuation de la chaleur sont :",[["rayonnement",1],["conduction",1],["convection",1],["ventilation pulmonaire",0]],"Les 4 processus : rayonnement, conduction, convection, évaporation. La ventilation n'en fait pas partie."],
["Dans quel sens se fait l'échange de chaleur ?",[["du plus chaud vers le moins chaud",1],["du moins chaud vers le plus chaud",0],["il est facile si l'air dépasse 37 °C",0],["il suit un gradient thermique",1],],"L'échange suit le gradient thermique, du chaud au moins chaud. Si le milieu dépasse 37 °C, évacuer la chaleur devient difficile."],
["Le rayonnement :",[["se fait sans contact entre le corps et la matière",1],["explique la perte d'environ 60 % de chaleur au repos vers 21 °C",1],["nécessite un contact direct",0],["est très efficace quand l'air est à 38 °C",0]],"Exemple : le soleil chauffe via ses rayons ; le corps émet de l'infrarouge. Sans contact, et inefficace si l'environnement est plus chaud que le corps."],
["La conduction :",[["suppose un contact entre corps ou matières",1],["concerne peu de disciplines sportives",1],["concerne un grimpeur qui emmagasine la chaleur du rocher",1],["se fait sans aucun contact",0]],"Transfert direct de chaleur, ex. pont du bateau et pieds du matelot, traileur sur sol chauffé, grimpeur sur rocher."],
["La convection :",[["est un échange avec un fluide (air, eau)",1],["est 25 fois plus importante dans l'eau que dans l'air",1],["est plus efficace quand le fluide se déplace vite",1],["est plus forte dans l'air que dans l'eau",0]],"Plus le gradient et la vitesse du fluide sont grands, plus la perte est efficace (course, vélo, nage). L'eau évacue bien plus que l'air."],
["Neutralité thermique : quelles valeurs ?",[["25 °C dans l'air",1],["34 °C dans l'eau",1],["34 °C dans l'air",0],["25 °C dans l'eau",0]],"Neutralité thermique : 25 °C dans l'air et 34 °C dans l'eau. Un nageur a moins de difficulté qu'un marathonien dans un air chaud."],
["Part de l'évaporation dans les pertes de chaleur :",[["environ 25 % au repos",1],["environ 80 % à l'exercice",1],["environ 80 % au repos",0],["elle devient négligeable à l'effort",0]],"L'évaporation (sudation) devient la voie principale à l'effort : ~25 % au repos, ~80 % à l'exercice."],
["Quels facteurs favorisent l'évaporation de la sueur ?",[["une grande surface d'échange",1],["la convection de l'air (vent)",1],["une hygrométrie élevée",0],["un taux d'humidité faible",1]],"Surface, circulation d'air, apport de chaleur et faible hygrométrie. Plus l'air est chargé d'eau, moins l'évaporation est possible."],
["En milieu chaud et humide :",[["la sudation s'évapore plus difficilement",1],["une sueur ruisselante est inefficace pour refroidir",1],["la sueur qui ne s'évapore pas refroidit bien la peau",0],["la chaleur endogène est facilement libérée",0]],"Une sueur qui ne s'évapore pas ne refroidit pas. Le risque de coup de chaleur augmente."],
["Conséquence sportive de l'évaporation :",[["l'athlète perd de l'eau pour maintenir sa température",1],["il risque de se déshydrater",1],["la transpiration baisse quand l'intensité augmente",0],["le débit sudoral augmente avec l'intensité",1]],"Le sportif transpire davantage quand l'intensité monte : la balance thermique est maintenue, mais au prix d'un risque de déshydratation."],
["Le frisson thermique :",[["est ordonné par l'hypothalamus",1],["est une succession de contractions involontaires",1],["sert à augmenter la production de chaleur",1],["fait partie de l'adaptation à la chaleur",0]],"Mécanisme de défense contre le froid pour éviter l'hypothermie. Il produit de la chaleur par contractions involontaires."],
["La thermogenèse sans frisson correspond à :",[["une vasoconstriction",1],["une diminution du flux sanguin cutané",1],["une vasodilatation cutanée",0],["une limitation de la perte de chaleur par la peau",1]],"La vasoconstriction réduit le flux cutané et donc les pertes de chaleur. Si elle est extrême (coupure totale), elle peut causer une nécrose."],
["Adaptation au froid chez le sportif :",[["elle est surtout comportementale (s'habiller)",1],["elle est très peu physiologique",1],["elle supprime le risque d'hypothermie",0],["le vent et l'humidité aggravent le froid ressenti",1]],"Les adaptations physiologiques sont limitées : le sportif doit anticiper et s'habiller en conséquence. Le froid venteux/humide augmente le risque."],
["Signes d'un échauffement bien réalisé :",[["rougissement (système sanguin engagé)",1],["dévêtissement",1],["frissons permanents",0],["arrêt de la circulation périphérique",0]],"Le sang amène la chaleur à la peau (rougissement) et l'athlète se dévêt : la thermorégulation est engagée."]
]},
{t:"Cours 2 · Chaud et altitude",q:null},
{t:"Cours 3 · Le muscle",q:null}];
const D={1:"https://docs.google.com/document/d/1Pr0HBetb-WGrIXWPpfiFFsoO33cIW2uwgV1nCBJk7TU/edit",2:"https://docs.google.com/document/d/180ufKr5DO8qv2YzZmcviz5uflLUZ0i0R8KVWaENtwWI/edit"};
const R=[
["Les propositions 1 et 3 reprennent la définition et l'exemple du cours. Faux : l'augmentation de température à l'effort est une conséquence de l'effort, pas la définition ; et l'homéostasie concerne tout organisme vivant.","Chap. 1 · Homéostasie","Homéostasie, c'est la capacité d'un organisme à maintenir son environnement interne stable face à la variabilité extérieure. Exemple : l'altitude crée une rupture de l'homéostasie, la thermorégulation permet de réguler l'homéostasie."],
["Homéotherme = température stable proche de 37 °C, pilotée par le cerveau. Faux : elle ne dépend pas uniquement du milieu, et elle peut varier avec le lieu de pratique et dès les premiers efforts.","Chap. 1 · La thermorégulation","L'homme est donc un endotherme / homéotherme → maintient sa température corporelle à une valeur proche de 37°. Température centrale gérée par le cerveau."],
["Les trois propositions vraies viennent de cette citation. La fausse inverse le phénomène : l'effort augmente la température musculaire, il ne la baisse pas.","Chap. 1 · La thermorégulation","Si la température centrale se situe approximativement à 37° au repos, elle peut dépasser 40° lors de l'exercice, avec une température musculaire extrême de l'ordre de 42°, indiquant ainsi un stockage important de la chaleur."],
["À retenir : 25 / 75. Un quart seulement de l'énergie chimique devient mouvement, le reste est de la chaleur. Faux : « 75 % mécanique » inverse les valeurs, et « 50/50 » n'est pas dans le cours.","Chap. 1 · Principe de la thermodynamique","100 % NRJ Chimique = 25 % NRJ mécanique + 75 % NRJ thermique (chaleur endogène)."],
["Chaîne logique : intensité ↑ → énergie mécanique ↑ → énergie chimique ↑ → chaleur ↑ (3/4). Il faut donc évacuer plus, et la sudation augmente : « moins de chaleur » et « sudation plus faible » sont faux.","Chap. 1 · Principe de la thermodynamique","+ effort est intense → + besoin d'NRJ mécanique et donc chimique dont les 3/4 sont converties sous forme de chaleur endogène."],
["Thermostat à 37 °C + évacuation par la peau (le sang amène la chaleur à la périphérie). Faux : il ne stocke pas la chaleur dans les muscles, et il agit aussi au froid (il ordonne le frisson), pas seulement au froid.","Chap. 1 · La thermorégulation","Le corps utilise l'hypothalamus pour jouer un rôle de thermostat (37°). L'hypothalamus élimine la chaleur supplémentaire vers le milieu ambiant (gradient) avec la surface de la peau."],
["Moyen mnémotechnique : R-C-C-E (Rayonnement, Conduction, Convection, Évaporation). La ventilation pulmonaire n'est pas citée dans le cours comme processus d'évacuation.","Chap. 1 · Les quatre processus","Ce supplément de chaleur va être évacué selon quatre processus possibles : le rayonnement (ou radiation), la conduction, la convection, l'évaporation."],
["Le sens est toujours du plus chaud vers le moins chaud (gradient thermique). Si l'air dépasse 37 °C, le gradient disparaît ou s'inverse : le corps ne peut plus se débarrasser de sa chaleur par ce mode.","Chap. 1 · Le rayonnement","Difficile d'évacuer la chaleur quand l'environnement est plus chaud que la température interne. Exemple : effort produit à température ambiante supérieure à 37°."],
["Rayonnement = sans contact (soleil, infrarouge). Faux : le contact, c'est la conduction ; et à 38 °C ambiant, le gradient est inversé, donc le rayonnement n'évacue plus la chaleur.","Chap. 1 · Le rayonnement","Pas de contact entre corps et matières. [...] Un organisme au repos perd 60 % de chaleur dans un milieu ambiant compris aux alentours des 21°."],
["Conduction = contact direct. Elle concerne peu de sports, mais retiens les exemples : traileur ou marathonien sur sol chauffé, grimpeur sur rocher. « Sans aucun contact » décrit le rayonnement.","Chap. 1 · La conduction","Le marathonien ou le traileur courant sur une terre fortement chauffée par le soleil, le grimpeur emmagasinant la chaleur du rocher par conduction."],
["Convection = contact avec un fluide en mouvement. L'eau évacue 25 fois plus que l'air, donc il est plus difficile d'évacuer la chaleur dans l'air : « plus forte dans l'air » est faux.","Chap. 1 · La convection","Échange de chaleur réalisé par un corps en contact avec un fluide (air, eau, etc). L'échange de chaleur est 25 fois plus important dans l'eau que dans l'air."],
["Piège classique : l'inversion des valeurs. L'eau évacue la chaleur bien plus vite, donc la neutralité thermique y est à une température plus élevée (34 °C) que dans l'air (25 °C).","Chap. 1 · La convection","La neutralité thermique est ainsi de 25° dans l'air et de 34° dans l'eau."],
["Chiffres à retenir : 25 % au repos → 80 % à l'exercice. L'évaporation devient la voie principale à l'effort, elle n'est jamais négligeable.","Chap. 1 · L'évaporation","Au repos, l'homme élimine 25 % de sa chaleur par évaporation. En exercice près de 80 % des pertes de chaleurs sont dues à l'évaporation."],
["Exemple du cours : un linge sèche plus vite au soleil et par temps chaud. Une hygrométrie élevée (air chargé d'eau) ralentit l'évaporation, d'où la fausseté de la proposition C.","Chap. 1 · L'évaporation","Elle est aussi favorisée par la convection de l'air augmentée par le vent, la chaleur du milieu ambiant (un linge sèche plus vite au soleil) et un taux d'hygrométrie faible."],
["La sudation est bloquée quand l'humidité de l'air dépasse celle de la peau : la chaleur endogène est mal libérée, d'où le risque de coup de chaleur. Le cours donne aussi : au-delà de 70 % d'humidité, −5 % de performance par palier de 5 %.","Chap. 1 · Adaptation au chaud et humide","Une sueur qui ne s'évapore pas ne refroidit nullement la surface de la peau. De fait, une sueur ruisselante est inefficace pour la thermorégulation.",2],
["Intensité ↑ → chaleur ↑ → débit sudoral ↑ → pertes en eau ↑. Le cours précise aussi qu'une perte de 2 % d'eau peut coûter 20 % de performance sur un effort de plus de 30 min.","Chap. 1 · L'évaporation (conséquences sportives)","L'athlète perd de l'eau pour maintenir sa température interne et il risque donc de se déshydrater. Le sportif transpire plus dès qu'il augmente son intensité d'exercice."],
["Le frisson est une défense contre le froid (éviter l'hypothermie), pas contre la chaleur. À distinguer des contractions volontaires et de la thermogenèse sans frisson.","Chap. 1 · L'adaptation au froid","L'hypothalamus va ordonner le frisson thermique (succession de contractions musculaires involontaires afin d'augmenter la production de chaleur de l'organisme)."],
["Vasoconstriction = on ferme les vaisseaux de la peau pour garder la chaleur. La vasodilatation cutanée est l'inverse : c'est ce qui se produit à la chaleur.","Chap. 1 · L'adaptation au froid","La thermogenèse sans frisson correspond à la vasoconstriction des vaisseaux sanguins diminuant ainsi le flux sanguin cutané. (Si extrême : coupure totale → nécrose)"],
["Les adaptations existent mais restent limitées : le risque d'hypothermie n'est jamais supprimé, et le vent ou l'humidité aggravent le froid ressenti. Conseil du cours : anticiper et s'habiller en conséquence.","Chap. 1 · Adaptation au froid venteux et/ou humide","L'efficacité d'adaptation est dans l'habillage (comportemental) et très peu physiologique.",2],
["Le sang amène la chaleur à la peau (rougissement) puis on se dévêt : la thermorégulation est engagée. Les « frissons » (froid) et l'« arrêt de circulation périphérique » sont à l'opposé.","Chap. 1 · La thermorégulation","Symptômes d'un échauffement bien réalisé : système sanguin engagé (rougissement), dévêtissement."]
];
let ci=0,i=0,sc=0,tot=0,done=false,stopped=false,S={};
try{S=JSON.parse(localStorage.getItem("staps"))||{}}catch(e){}
if(S[0])({i,sc,tot}=S[0]);
function save(){S[ci]={i:i+(done?1:0),sc,tot};try{localStorage.setItem("staps",JSON.stringify(S))}catch(e){}}
function pick(k){save();ci=k;({i,sc,tot}=S[k]||{i:0,sc:0,tot:0});stopped=false;done=false;show()}
function stop(){save();if(done)i++;done=false;stopped=true;show()}
function redo(){i=0;sc=0;tot=0;stopped=false;done=false;save();show()}
const $=s=>document.querySelector(s),L="ABCD";
function tabs(){$("#tabs").innerHTML=C.map((c,k)=>`<button ${c.q?"":"disabled"} class="${k==ci?"on":""}" onclick="pick(${k})">${c.t}${c.q?"":" (bientôt)"}</button>`).join("")}
function show(){tabs();const Q=C[ci].q;
if(i>=Q.length||stopped){const fin=i>=Q.length;$("#app").innerHTML=`<div class="card"><p class="n">${fin?"Terminé":"En pause"} · ${C[ci].t}</p><div class="big">${sc} / ${tot}</div><p>propositions correctement jugées${tot?" ("+Math.round(100*sc/tot)+" %)":""}, sur ${i} question${i>1?"s":""} sur ${Q.length}.</p>${fin?"":`<button class="btn" onclick="stopped=false;show()">Reprendre à la question ${i+1}</button> `}<button class="btn ghost" onclick="redo()">Recommencer ce cours</button><p class="n">Pour changer de cours, utilise les onglets en haut : ta progression est conservée.</p></div>`;return}
const q=Q[i];done=false;
$("#app").innerHTML=`<div class="card"><div class="bar"><i style="width:${100*i/Q.length}%"></i></div><div class="n">Question ${i+1} / ${Q.length}</div><div class="q">${q[0]}</div><div id="p">${q[1].map((p,k)=>`<label><input type="checkbox" id="c${k}"><span><b>${L[k]}.</b> ${p[0]}</span></label>`).join("")}</div><div id="r"></div><button class="btn" id="b" onclick="go()">Valider</button> <button class="btn ghost" onclick="stop()">Arrêter</button></div>`}
function go(){const q=C[ci].q[i];
if(!done){done=true;let g=0;
q[1].forEach((p,k)=>{const c=$("#c"+k),l=c.parentElement,right=(c.checked?1:0)==p[1];c.disabled=true;if(right)g++;tot++;
l.classList.add(right?"ok":"ko");l.insertAdjacentHTML("beforeend",`<span class="tag" style="color:var(--${right?"ok":"ko"})">${p[1]?"VRAI":"FAUX"} ${right?"✓":"✗"}</span>`)});
sc+=g;save();const r=ci==0?R[i]:null;$("#r").innerHTML=`<div class="ex"><b>${g} / 4 correctes.</b> ${q[2]}${r?`<p style="margin:10px 0 0"><b>Détail :</b> ${r[0]}</p>`:""}</div>`+(r?`<div class="ex cours"><b>📖 Dans ton cours</b> <span class="n">· ${r[1]}</span><blockquote>${r[2]}</blockquote><a href="${D[r[3]||1]}" target="_blank" rel="noopener">Ouvrir le cours ↗</a></div>`:"");$("#b").textContent=i+1<C[ci].q.length?"Question suivante":"Voir mon score"}
else{i++;show();window.scrollTo(0,0)}}
show();
</script></body></html>
